<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackintosh EFI – i5-11600K + RX 5700 XT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <script src="https://kit.fontawesome.com/206cfaa471.js" crossorigin="anonymous"></script>
  <style>
    html, body {
      background-color: #14121d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .section {
      padding: 2rem 1rem;
    }
    .title {
      color: #ffffff;
      word-break: break-word;
    }
    .navbar-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }
    .buttons.has-addons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .button.is-static {
      background-color: #3c3a4f;
      color: #bfbfbf;
    }
    .button.is-info {
      background-color: #5a4be7;
      border-color: transparent;
    }
    .button.is-primary {
      background-color: #2be4dc;
      border-color: transparent;
      color: #1e1b2e;
    }
    pre {
      background-color: #2b293a;
      padding: 1rem;
      overflow-x: auto;
      border-radius: 8px;
      color: #f8f8f2;
    }
    .markdown img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .content table {
      background-color: transparent;
      color: #e0e0e0;
      margin-top: 1.5rem;
      width: 100%;
      overflow-x: auto;
    }
    .content th, .content td {
      border-color: #444;
      padding: 0.75rem;
    }
    .content h2, .content h3, .content h4 {
      color: #ffffff;
      margin-top: 2rem;
    }
    .content ul li::marker {
      color: #2be4dc;
    }
    .floating-download {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background-color: #35324b;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .floating-download:hover {
      background-color: #5a4be7;
    }
    @media (max-width: 768px) {
      .is-flex.is-justify-content-space-between {
        flex-direction: column;
        align-items: center;
      }
      .navbar-controls {
        flex-direction: row;
        gap: 0.5rem;
      }
      .buttons.has-addons {
        flex-wrap: nowrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <div class="is-flex is-justify-content-space-between is-align-items-center is-flex-wrap-wrap mb-4">
        <h1 id="title" class="title is-3 mb-2"></h1>
        <div class="navbar-controls">
          <div class="buttons has-addons">
            <span class="button is-static">Langue</span>
            <button class="button is-info" onclick="setLanguage('en')">EN</button>
            <button class="button is-primary" onclick="setLanguage('fr')">FR</button>
          </div>
        </div>
      </div>
      <div id="content" class="content markdown"></div>
    </div>
  </section>

  <a href="https://github.com/fabienmillet/Hackintosh-EFI-i5-11600K-RX5700XT/releases/download/v1.0/EFI.zip" class="floating-download" title="Télécharger EFI" target="_blank">
    <i class="fas fa-download"></i>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function fetchMarkdown(lang) {
      const file = lang === 'en' ? 'README.md' : 'README-FR.md';
      const response = await fetch(file);
      const text = await response.text();
      return text.replace(/iMacPro1,1/g, 'iMacPro1\\,1');
    }

    async function setLanguage(lang) {
      const raw = await fetchMarkdown(lang);
      const title = raw.match(/^# (.*)/)?.[1] ?? "Hackintosh EFI";
      const mdContent = raw.replace(/^# .*/m, "");
      document.getElementById("title").innerText = title;
      document.getElementById("content").innerHTML = marked.parse(mdContent);
    }

    setLanguage('en');
  </script>
</body>
</html>
