<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackintosh EFI – i5-11600K + RX 5700 XT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-dU1zL0WexCV07PTa2rgMwa9jFBUX8LLZWDWyfSo8XZh4rTnA7cFR0Pvw6WZaz5y6DaTTpmxXZFaJPChhoZP4Yg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    html, body {
      background-color: #181624;
      color: #e0e0e0;
    }
    .section {
      padding-top: 2rem;
    }
    .title {
      color: #ffffff;
    }
    .button.is-static {
      background-color: #3c3a4f;
      color: #bfbfbf;
    }
    .button.is-info {
      background-color: #5a4be7;
      border-color: transparent;
    }
    .button.is-primary {
      background-color: #2be4dc;
      border-color: transparent;
      color: #1e1b2e;
    }
    .button.is-dark {
      background-color: #29263d;
      border-color: transparent;
      color: #ffffff;
    }
    pre {
      background-color: #2d2b3f;
      padding: 1rem;
      overflow-x: auto;
      border-radius: 6px;
      color: #f8f8f2;
    }
    .markdown img {
      max-width: 100%;
      border-radius: 8px;
    }
    .content table {
      background-color: transparent;
      color: #e0e0e0;
    }
    .content th, .content td {
      border-color: #444;
    }
    .content h2, .content h3, .content h4 {
      color: #ffffff;
    }
    .content ul li::marker {
      color: #2be4dc;
    }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <nav class="level">
        <div class="level-left">
          <div class="level-item">
            <h1 id="title" class="title is-3"></h1>
          </div>
        </div>
        <div class="level-right">
          <div class="level-item">
            <div class="buttons has-addons">
              <span class="button is-static">Langue</span>
              <button class="button is-info" onclick="setLanguage('en')">EN</button>
              <button class="button is-primary" onclick="setLanguage('fr')">FR</button>
            </div>
            <a href="https://github.com/fabienmillet/Hackintosh-EFI-i5-11600K-RX5700XT/releases/download/v1.0/EFI.zip" class="button is-dark ml-3" target="_blank">
              <span class="icon"><i class="fas fa-download"></i></span>
              <span>Télécharger EFI</span>
            </a>
          </div>
        </div>
      </nav>

      <div id="content" class="content markdown"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function fetchMarkdown(lang) {
      const file = lang === 'en' ? 'README.md' : 'README-FR.md';
      const response = await fetch(file);
      const text = await response.text();
      return text.replace(/iMacPro1,1/g, 'iMacPro1\\,1');
    }

    async function setLanguage(lang) {
      const raw = await fetchMarkdown(lang);
      const title = raw.match(/^# (.*)/)?.[1] ?? "Hackintosh EFI";
      const mdContent = raw.replace(/^# .*/m, "");
      document.getElementById("title").innerText = title;
      document.getElementById("content").innerHTML = marked.parse(mdContent);
    }

    setLanguage('en');
  </script>
</body>
</html>
